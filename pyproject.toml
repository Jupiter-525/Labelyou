[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelyou-local"
version = "1.0.0"
description = "Labelyou Windows 图片预分类工具"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
labelyou = "image_preclassifier:main"

[tool.setuptools]
py-modules = ["image_preclassifier"]
